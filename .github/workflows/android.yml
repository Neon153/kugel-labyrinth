name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit-Tests, Lint, Debug-APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle einrichten (inkl. Wrapper-Validierung und Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: kugel-labyrinth-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Test- und Lint-Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: berichte
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore
