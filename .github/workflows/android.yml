name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit-Tests, Lint, Debug-APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle einrichten (inkl. Wrapper-Validierung und Cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-Source-Cache (@actions/cache) statt des Standard-Cache-Anbieters
          cache-provider: basic

      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Debug-APKs bauen (Handy + Uhr)
        run: ./gradlew --no-daemon assembleDebug

      - name: Handy-APK hochladen
        uses: actions/upload-artifact@v7
        with:
          name: kugel-labyrinth-handy-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Uhr-APK hochladen
        uses: actions/upload-artifact@v7
        with:
          name: kugel-labyrinth-uhr-apk
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Test- und Lint-Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: berichte
          path: |
            */build/reports/tests/
            */build/reports/lint-results-debug.html
            */build/test-results/
          if-no-files-found: ignore
